<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发票合规预审 · 演示</title>
<style>
  :root{
    --brand:#3370ff; --brand-weak:#eaf0ff;
    --ok:#2f7d4f; --ok-bg:#e8f4ee;
    --mid:#b45309; --mid-bg:#fef3c7;
    --high:#b42318; --high-bg:#fdecea;
    --ink:#1f2329; --sub:#646a73; --weak:#8f959e;
    --line:#e2e5ea; --line-soft:#eef0f3;
    --bg:#f6f7f9; --card:#fff;
    --r-lg:12px; --r-md:8px; --r-sm:6px;
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6; }
  .app{ max-width:1180px; margin:0 auto; padding:0 20px 48px; }

  /* ---------- 顶栏 ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding:16px 0; border-bottom:1px solid var(--line); margin-bottom:16px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .logo{ width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--brand),#5b8bff); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:15px; box-shadow:var(--shadow); }
  .brand-name{ font-size:17px; font-weight:700; letter-spacing:.2px; }
  .brand-sub{ font-size:12px; color:var(--sub); }
  .top-right{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }

  /* 分段模式切换（segmented control） */
  .seg{ display:flex; background:var(--line-soft); border:1px solid var(--line); border-radius:var(--r-md); padding:3px; gap:2px; }
  .seg button{ border:none; background:transparent; padding:5px 14px; border-radius:6px; font-size:13px; color:var(--sub); cursor:pointer; }
  .seg button.active{ background:#fff; color:var(--ink); font-weight:600; box-shadow:var(--shadow); }
  .badge{ font-size:11px; padding:2px 10px; border-radius:10px; border:1px solid; font-weight:600; }
  .badge.demo{ background:var(--mid-bg); color:var(--mid); border-color:#fcd34d; }
  .badge.live{ background:var(--ok-bg); color:var(--ok); border-color:var(--ok); }

  /* ---------- 工作台：左右分栏 ---------- */
  .layout{ display:grid; grid-template-columns:340px 1fr; gap:16px; align-items:start; }
  @media (max-width:900px){ .layout{ grid-template-columns:1fr; } }
  .input-panel{ display:flex; flex-direction:column; gap:14px; position:sticky; top:16px; }
  @media (max-width:900px){ .input-panel{ position:static; } }
  .output-panel{ min-width:0; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); }
  .card-pad{ padding:16px; }
  .card h3{ font-size:13px; font-weight:700; color:var(--sub); text-transform:none; margin-bottom:10px; letter-spacing:.3px; }
  .card h3 .n{ color:var(--ink); }

  /* 上传区 */
  .drop{ border:1.5px dashed var(--line); border-radius:var(--r-md); padding:22px 14px; text-align:center; cursor:pointer; transition:border-color .15s, background .15s; background:#fafbfc; }
  .drop:hover, .drop.over{ border-color:var(--brand); background:var(--brand-weak); }
  .drop .ic{ font-size:26px; line-height:1; margin-bottom:8px; }
  .drop .t{ font-size:13.5px; font-weight:600; }
  .drop .s{ font-size:12px; color:var(--sub); margin-top:2px; }
  .filelist{ font-size:12.5px; color:var(--sub); margin-top:10px; }
  .filelist .f{ display:flex; align-items:center; gap:6px; background:var(--line-soft); border-radius:6px; padding:4px 8px; margin-top:4px; font-size:12px; overflow:hidden; }
  .filelist .f .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* 按钮 */
  .btn{ font:inherit; border:none; cursor:pointer; border-radius:var(--r-md); padding:9px 14px; font-size:14px; font-weight:600; transition:filter .12s; }
  .btn-primary{ background:var(--brand); color:#fff; width:100%; box-shadow:0 1px 2px rgba(51,112,255,.3); }
  .btn-primary:hover{ filter:brightness(1.05); }
  .btn-primary:disabled{ opacity:.55; cursor:not-allowed; }
  .btn-ghost{ background:#fff; color:var(--brand); border:1px solid var(--brand); padding:5px 12px; font-size:13px; font-weight:500; }
  .btn-ghost:hover{ background:var(--brand-weak); }

  /* 折叠（渐进披露） */
  details.adv{ border:1px solid var(--line); border-radius:var(--r-md); background:#fafbfc; }
  details.adv summary{ cursor:pointer; padding:9px 12px; font-size:13px; font-weight:600; color:var(--sub); list-style:none; display:flex; align-items:center; justify-content:space-between; }
  details.adv summary::-webkit-details-marker{ display:none; }
  details.adv summary::after{ content:"展开 ▾"; font-size:12px; font-weight:400; color:var(--weak); }
  details.adv[open] summary::after{ content:"收起 ▴"; }
  details.adv .inner{ padding:4px 12px 12px; overflow-x:auto; }
  .inv-card{ }
  .inv-card summary{ list-style:none; cursor:pointer; }
  .inv-card summary::-webkit-details-marker{ display:none; }
  .inv-card[open] summary{ border-bottom:1px solid var(--line-soft); padding-bottom:8px; }
  .inv-body{ margin-top:8px; }
  .inv-card.partial{ background:#fdfbf7; border-color:#e5d5a8; }
  .stb.q{ background:#fdf6e3; color:#9a6700; }
  .btn-ghost:disabled{ opacity:.45; cursor:not-allowed; }
  .print-head{ display:none; }
  @media print{ .view-switch{ display:none !important; } }

  .fld{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .fld label{ font-size:12px; color:var(--sub); font-weight:600; }
  input[type=text], input[type=password]{ font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:var(--r-md); background:#fff; width:100%; }
  input:focus{ outline:none; border-color:var(--brand); box-shadow:0 0 0 2px var(--brand-weak); }
  .hint{ color:var(--sub); font-size:12px; margin-top:6px; line-height:1.5; }
  .hint.err{ color:var(--high); }
  .hint.okc{ color:var(--ok); }

  /* 输出区 */
  #empty{ text-align:center; padding:64px 20px; color:var(--sub); }
  #empty .ic{ font-size:40px; margin-bottom:12px; }
  #empty .t{ font-size:15px; font-weight:600; color:var(--ink); }
  #empty .s{ font-size:13px; margin-top:6px; }

  /* KPI 摘要 */
  .kpis{ display:grid; grid-template-columns:repeat(6,1fr); gap:10px; padding:16px; }
  @media (max-width:720px){ .kpis{ grid-template-columns:repeat(3,1fr); } }
  .kpi{ background:#fafbfc; border:1px solid var(--line-soft); border-radius:var(--r-md); padding:10px 12px; }
  .kpi .n{ font-size:20px; font-weight:800; line-height:1.2; }
  .kpi .l{ font-size:11.5px; color:var(--sub); margin-top:2px; }
  .kpi .n.ok{ color:var(--ok); } .kpi .n.mid{ color:var(--mid); } .kpi .n.high{ color:var(--high); }
  .kpi.main{ background:var(--brand-weak); border-color:#d6e2ff; }
  .kpi.main .l{ color:#3d5bb3; }

  /* 风险清单：密集行式列表（财务批量复核场景，DeepSeek 评审 P0） */
  .section{ margin-top:14px; }
  .section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; flex-wrap:wrap; gap:8px; }
  .section-head h2{ font-size:15px; font-weight:700; }
  .section-head .sub{ font-size:12px; color:var(--sub); }
  .tools{ display:flex; gap:6px; }
  .tools .btn-ghost{ padding:4px 10px; font-size:12px; }
  .finding{ border:1px solid var(--line); border-radius:var(--r-md); background:#fff; margin-bottom:5px; }
  .finding summary{ list-style:none; display:flex; align-items:center; gap:8px; padding:7px 10px; cursor:pointer; border-radius:var(--r-md); flex-wrap:wrap; }
  .finding summary::-webkit-details-marker{ display:none; }
  .finding summary:hover{ background:#fafbfc; }
  /* 输出区视图切换（P1③，DeepSeek 评审：三视图+无命中票可验证） */
  .view-switch{ display:flex; gap:6px; margin:12px 0 0; background:#fff; border:1px solid var(--line); border-radius:var(--r-md); padding:4px; width:max-content; max-width:100%; flex-wrap:wrap; }
  .vs{ border:0; background:transparent; padding:7px 16px; font-size:13px; color:var(--sub); border-radius:8px; cursor:pointer; font-weight:500; }
  .vs.active{ background:var(--brand); color:#fff; }
  .report-view{ margin-top:10px; }
  .inv-group, .rule-group{ display:flex; flex-direction:column; gap:10px; }
  .inv-card, .rule-card{ background:#fff; border:1px solid var(--line-soft); border-radius:var(--r-md); padding:10px; }
  .inv-card.clean{ background:#fbfdfc; }
  .inv-head, .rule-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; }
  .inv-no{ font-weight:700; }
  .inv-full{ color:var(--weak); font-size:11.5px; font-family:ui-monospace,Menlo,Consolas,monospace; }
  .inv-meta{ color:var(--sub); font-size:12px; }
  .inv-list{ margin-top:8px; display:flex; flex-direction:column; gap:8px; }
  .inv-clean-note{ margin-top:8px; font-size:12px; color:var(--ok); background:var(--ok-bg); padding:8px 10px; border-radius:8px; }
  .stb.warn{ background:var(--mid-bg); color:var(--mid); }
  .view-note{ font-size:12px; color:#9a6700; background:#fdf6e3; padding:8px 12px; border-radius:8px; margin-bottom:10px; line-height:1.6; }
  .rule-cnt{ margin-left:auto; font-size:12px; color:var(--sub); }
  .rule-cnt b{ color:var(--ink); }
  .rule-hits{ margin-top:8px; border:1px solid var(--line-soft); border-radius:8px; }
  .rule-hits summary{ cursor:pointer; padding:8px 10px; font-size:12.5px; font-weight:600; color:var(--sub); list-style:none; }
  .rule-hits summary::-webkit-details-marker{ display:none; }
  .rule-hits summary::after{ content:"展开 ▾"; font-size:12px; font-weight:400; color:var(--weak); margin-left:6px; }
  .rule-hits[open] summary::after{ content:"收起 ▴"; }
  .rule-hits .inner{ padding:8px; display:flex; flex-direction:column; gap:8px; }
  .rule-note{ margin-top:8px; font-size:12px; color:var(--high); background:var(--high-bg); padding:8px 10px; border-radius:8px; line-height:1.6; }
  .finding[open] summary{ background:#fafbfc; border-bottom:1px solid var(--line-soft); }
  .finding .bar{ width:3px; align-self:stretch; border-radius:2px; flex-shrink:0; }
  .bar.high{ background:var(--high); } .bar.mid{ background:var(--mid); } .bar.low{ background:var(--weak); }
  .finding .sev{ font-size:11px; font-weight:800; padding:1px 8px; border-radius:10px; letter-spacing:.2px; white-space:nowrap; }
  .sev.high{ background:var(--high-bg); color:var(--high); } .sev.mid{ background:var(--mid-bg); color:var(--mid); } .sev.low{ background:var(--line-soft); color:var(--sub); }
  .finding .rname{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:0 1 auto; }
  .finding .ticket{ font-size:12px; color:var(--sub); font-family:ui-monospace,Menlo,Consolas,monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:0 1 auto; }
  @media (max-width:480px){ .finding .ticket{ flex-basis:100%; padding-left:11px; } }
  /* ===== 双端响应式打磨（2026-09-23）===== */
  .drop .t .desk{ display:inline; } .drop .t .mob{ display:none; }
  .drop .s .kbd{ display:inline; }
  .camera-btn{ display:none; }
  @media (max-width:768px){
    .drop .t .desk{ display:none; } .drop .t .mob{ display:inline; }
    .drop .s .kbd{ display:none; }
    .camera-btn{ display:flex; }
  }
  /* 触摸设备判定（DeepSeek 评审修正：宽度改 pointer:coarse，覆盖 iPad/触屏本） */
  @media (pointer:coarse){
    .ops{ gap:10px; }
    .op{ min-height:44px; padding:9px 16px; font-size:13px; }
    .btn, .btn-ghost, .vs, .flt{ min-height:40px; }
  }
  @media (max-width:480px){
    .tools{ gap:8px; }
    .tools .btn-ghost{ white-space:nowrap; }
    .view-switch .vs{ padding:7px 12px; }
    .kpi{ padding:8px 10px; min-width:0; }
    .kpi .n{ font-size:18px; }
    .kpi .l{ word-break:keep-all; line-height:1.4; }
  }
  .finding .amt{ font-size:12.5px; font-weight:600; margin-left:auto; white-space:nowrap; }
  .finding .caret{ color:var(--weak); font-size:11px; flex-shrink:0; }
  .finding[open] .caret{ transform:rotate(90deg); }
  .finding .body{ padding:10px 12px 12px; }
  .finding .msg{ font-size:13.5px; font-weight:600; line-height:1.5; }
  .finding .meta{ font-size:12px; color:var(--sub); margin-top:6px; }
  .finding .meta code{ background:var(--line-soft); border-radius:4px; padding:0 5px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; }
  .finding .sug{ font-size:13px; margin-top:8px; }
  .finding .sug b{ color:var(--sub); font-weight:600; font-size:12px; }
  .chain{ font-size:12.5px; color:var(--sub); margin-top:8px; }
  .chain li{ margin:2px 0 2px 18px; }
  .chain code{ background:var(--line-soft); border-radius:4px; padding:0 5px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; }

  /* 通俗解释 */
  .explain{ margin-top:10px; background:var(--brand-weak); border-left:3px solid var(--brand); border-radius:0 var(--r-md) var(--r-md) 0; padding:10px 12px; font-size:13px; line-height:1.75; }
  .explain .tag{ display:inline-block; font-size:11px; font-weight:700; color:var(--brand); background:#fff; border:1px solid #c9d8ff; border-radius:10px; padding:1px 8px; margin-bottom:6px; }
  .explain b{ color:var(--ink); }
  .explain.tpl{ background:var(--line-soft); border-left-color:var(--weak); }
  .explain.tpl .tag{ color:var(--sub); border-color:var(--line); }

  /* 表格（折叠区） */
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th, td{ text-align:left; padding:7px 8px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
  th{ color:var(--sub); font-weight:600; font-size:12px; background:#fafbfc; }
  tr:last-child td{ border-bottom:none; }
  .pill{ display:inline-block; font-size:11.5px; padding:1px 8px; border-radius:10px; font-weight:600; }
  .pill.hit{ background:var(--high-bg); color:var(--high); }
  .pill.nohit{ background:var(--ok-bg); color:var(--ok); }
  .pill.skip{ background:var(--line-soft); color:var(--sub); }
  .ok{ color:var(--ok); } .mid{ color:var(--mid); } .high{ color:var(--high); }
  .fail{ color:var(--high); }

  /* 页脚元信息 */
  .meta{ color:var(--weak); font-size:11.5px; margin-top:12px; line-height:1.7; word-break:break-all; }
  .disc{ margin-top:8px; padding:8px 12px; background:#fafbfc; border-left:3px solid var(--line); font-size:12px; color:var(--sub); border-radius:0 var(--r-md) var(--r-md) 0; }

  .live-only{ display:none; }
  body.live .live-only{ display:block; }
  body.live .demo-only{ display:none; }

  /* 处置状态（P1①） */
  .finding.dim{ opacity:.55; }
  .stb{ font-size:11px; font-weight:700; padding:1px 8px; border-radius:10px; white-space:nowrap; }
  .stb.resolved{ background:var(--ok-bg); color:var(--ok); }
  .stb.ignored{ background:var(--line-soft); color:var(--sub); }
  .disps{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:6px 2px 10px; }
  .dp{ font-size:12px; }
  .dp b{ font-size:15px; }
  .dp.pending b{ color:var(--mid); }
  .dp.resolved b{ color:var(--ok); }
  .dp.ignored b{ color:var(--sub); }
  .alldone{ font-size:12px; font-weight:700; color:var(--ok); background:var(--ok-bg); padding:2px 10px; border-radius:10px; }
  .ops{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .op{ font:inherit; font-size:12px; padding:4px 10px; border-radius:6px; cursor:pointer; border:1px solid var(--line); background:#fff; }
  .op.resolved{ color:var(--ok); border-color:var(--ok); }
  .op.resolved:hover{ background:var(--ok-bg); }
  .op.ignored{ color:var(--sub); border-color:var(--line); }
  .op.ignored:hover{ background:var(--line-soft); }
  .op.undo{ color:var(--brand); border-color:var(--brand); }
  .op.undo:hover{ background:var(--brand-weak); }
  .flt.active{ background:var(--brand-weak); color:var(--brand); border-color:var(--brand); font-weight:600; }

  /* 打印：只保留报告 */
  @media print{
    .topbar, .input-panel, .tools, details.adv summary{ display:none !important; }
    .print-head{ display:block; font-size:12px; color:#333; margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid #ccc; }
    .app{ max-width:100%; padding:0; }
    body{ background:#fff; }
    .finding{ break-inside:avoid; }
    .finding summary{ cursor:default; }
    .finding .caret{ display:none; }
    .finding .body{ display:block !important; }
  }
</style>
</head>
<body class="demo">
<div class="app">
  <!-- 顶栏：品牌 + 模式切换 -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">票</div>
      <div>
        <div class="brand-name">发票合规预审</div>
        <div class="brand-sub">数电票规则预审引擎 · ruleset <span id="ver">0.3.0</span></div>
      </div>
    </div>
    <div class="top-right">
      <span id="modeLabel" class="badge demo">演示模式（内置样例）</span>
      <div class="seg">
        <button id="btnDemo" class="active">演示模式</button>
        <button id="btnLive">真实模式</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <!-- 左栏：输入区 -->
    <aside class="input-panel">
      <section class="card card-pad">
        <h3>上传发票</h3>
        <div class="drop" id="dropZone" tabindex="0" role="button" aria-label="上传发票文件">
          <div class="ic">📄</div>
          <div class="t"><span class="desk">拖拽文件到此处，或点击选择</span><span class="mob">点击选择发票文件</span></div>
          <div class="s">支持数电票 XML/OFD/PDF · 可多选 · <span class="kbd">或粘贴 Ctrl+V</span></div>
        </div>
        <input id="fileInput" type="file" multiple accept=".xml,.ofd,.zip,.pdf" style="display:none">
        <button id="btnCamera" class="btn btn-ghost camera-btn" type="button" style="margin-top:10px;width:100%;justify-content:center;align-items:center;gap:6px;">📷 拍照识别发票（规划中）</button>
        <div class="filelist" id="fileList"></div>
        <button id="btnReview" class="btn btn-primary" style="margin-top:12px;">运行预审</button>
        <div class="hint" id="runHint">运行后右侧显示合规预审报告。文件仅发往你配置的后端，不发送第三方。</div>
      </section>

      <section class="card card-pad live-only">
        <h3>连接后端</h3>
        <div class="fld">
          <label for="backendUrl">后端地址</label>
          <input id="backendUrl" type="text" placeholder="https://xxx.trycloudflare.com 或 http://localhost:8000">
        </div>
        <div class="fld">
          <label for="apiKey">API Key（X-API-Key）</label>
          <input id="apiKey" type="password" placeholder="后端环境变量 INVOICE_API_KEY 的值">
        </div>
        <button id="btnTest" class="btn btn-ghost" style="margin-top:10px;">测试连接</button>
        <div class="hint" id="connHint">地址与 Key 仅保存在本浏览器，不发送到第三方。</div>
      </section>

      <section class="card card-pad demo-only">
        <h3>演示样例</h3>
        <div class="hint">内置 4 张样例发票 + 1 个失败文件，覆盖重复票（R1）、差额征税（R9）、行级勾稽（R10）、红冲关联（R11）与证据链展示。</div>
        <button id="btnRun" class="btn btn-ghost" style="margin-top:10px;">重新运行演示</button>
      </section>
    </aside>

    <!-- 右栏：输出区 -->
    <section class="output-panel">
      <div id="empty" style="display:none;">
        <div class="ic">🔍</div>
        <div class="t">上传发票，运行预审</div>
        <div class="s">左侧选择发票文件后点击「运行预审」，合规报告将显示在这里。</div>
      </div>
      <div id="result" role="status" aria-live="polite" tabindex="-1"></div>
    </section>
  </main>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);

/* ---------- 处置状态闭环（P1①，DeepSeek 任务卡落地） ---------- */
const DISP_KEY = "fap:dispositions:v1";
/* riskId 契约（DeepSeek 评审 C1/C2，2026-09-23 冻结）：
   - 输入拼接（顺序固定）：rule_id | invoice_no | RULE_VERSION | evidence_path
   - evidence_path：evidence_chain 按数组顺序，每项 field+":"+raw，| 连接（顺序=规则引擎输出顺序，不得排序——排序会改变语义）
   - 编码：UTF-8；票号不得 trim 后拼接（票号本身无空白，保持原样）
   - 前缀 v1: 预留哈希算法升级退路（换 sha256 时新旧键共存+一次性迁移）
   - 规则版本进入哈希：规则升版 → 结论可能变 → 处置状态重置属有意语义（见 KPI 口径说明） */
const RID_SCHEMA = "v1";
function fnv1a64(s) {
  let h1 = 0x811c9dc5, h2 = 0x01000193 >>> 0; // 简化：用两个 32 位 FNV 变体拼 16 hex
  let a = 0x811c9dc5, b = 0x01000193;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    a ^= c; a = Math.imul(a, 0x01000193) >>> 0;
    b = (b + c) | 0; b = Math.imul(b, 0x85ebca6b) >>> 0;
  }
  return a.toString(16).padStart(8, "0") + b.toString(16).padStart(8, "0");
}
function riskId(f) {
  const path = (f.evidence_chain || []).map(e => e.field + ":" + (e.raw ?? "")).join("|");
  return RID_SCHEMA + ":" + fnv1a64([f.rule_id, f.invoice_no || "", "0.3.0", path].join("|"));
}
function loadDisp() { try { return JSON.parse(localStorage.getItem(DISP_KEY) || "{}"); } catch (e) { return {}; } }
const DISP_MAX = 500;
function saveDisp(d) {
  const keys = Object.keys(d);
  if (keys.length > DISP_MAX) { // 上限淘汰最旧（按 updatedAt）
    const sorted = keys.filter(k => d[k] && d[k].updatedAt)
      .sort((a, b) => (d[a].updatedAt < d[b].updatedAt ? -1 : 1));
    const drop = keys.length - DISP_MAX;
    sorted.slice(0, drop).forEach(k => delete d[k]);
  }
  try { localStorage.setItem(DISP_KEY, JSON.stringify(d)); return true; }
  catch (e) { window.__dispStoreFail = true; return false; } // 隐私模式/配额满：处置不保留
}
function getDisp(id) { return loadDisp()[id] || null; } // 不变式：永不返回 undefined 状态
function setDisp(id, status) {
  const d = loadDisp();
  if (status === "pending") delete d[id];
  else d[id] = { status, updatedAt: new Date().toISOString() };
  if (!saveDisp(d)) window.__dispStoreFail = true;
}
window.addEventListener("storage", e => { // 多标签页同步（深评中4）
  if (e.key === DISP_KEY && __lastReport) renderReport();
});
function getDisp(id) { return loadDisp()[id] || null; }
function setDisp(id, status) {
  const d = loadDisp();

}
const DISP_LABEL = { pending: "待处理", resolved: "已处理", ignored: "已忽略" };

/* 票号缩略：长票号行内只显示前4…后8（防手机窄屏溢出），完整票号在展开区 */
function shortNo(n) {
  n = String(n ?? "");
  return n.length > 14 ? n.slice(0,4) + "…" + n.slice(-8) : n;
}

/* 导出 CSV（DeepSeek 评审 P0：财务需留痕/导出） */
/* CSV 注入防护（DeepSeek P1）：字段以 = + - @ 开头时加 ' 前缀（防 Excel/WPS 公式执行）；
   剥离 tab/换行（防单元格注入）；双引号包裹 + 转义 */
function csvCell(v) {
  let s = String(v ?? "");
  if (/[\t\r\n]/.test(s)) s = s.replace(/[\t\r\n]+/g, " ");
  if (/^[=+\-@]/.test(s)) s = "'" + s;
  return `"${s.replace(/"/g, '""')}"`;
}
function exportCSV(findings, metaMap) {
  const rows = [["# 导出范围：全量命中清单（N 条，不随视图切换变化） · 生成 " + new Date().toISOString()]];
  rows.push(["规则", "规则名", "严重度", "置信度", "票号", "字段", "问题", "建议", "处置状态", "处置时间"]);
  (findings || []).forEach(f => {
    const d = getDisp(riskId(f));
    rows.push([
      f.rule_id, resolveRuleMeta(f.rule_id, metaMap || {}), f.severity, f.confidence || "疑似", f.invoice_no,
      f.field, f.message, f.suggestion,
      d ? DISP_LABEL[d.status] : DISP_LABEL.pending,
      d ? d.updatedAt.slice(0,16).replace("T", " ") : ""
    ]);
  });
  const csv = "\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\n");
  const blob = new Blob([csv], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "invoice-precheck-findings-" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

    <div class="body">
      <div class="msg">${esc(f.message)}</div>
      <div class="meta">票号 <code>${esc(f.invoice_no)}</code> · 字段 <code>${esc(f.field)}</code> · 原文「${esc(f.evidence)}」 · 置信度 ${esc(conf)}</div>
      ${chain ? `<ul class="chain"><b>证据链：</b>${chain}</ul>` : ""}
      <div class="sug"><b>建议：</b>${esc(f.suggestion)}</div>
      ${explainBlock(f)}
      <div class="ops">${ops}${showOps ? `<span class="hint" style="margin-top:0;">${st !== "pending" ? "处置时间 " + esc(t0) : "处置后状态保留在本浏览器（localStorage），导出 CSV 将携带处置信息"}</span>` : ""}</div>
    </div>
  </details>`;
}

/* 发票视图（P1③）：按票分组，无命中票可见（防沉默暗示合规） */
function invoiceViewHtml(d, metaMap) {
  const sevRank = {高:0, 中:1, 低:2};
  const byInv = {};
  (d.findings||[]).forEach(f => (byInv[f.invoice_no] = byInv[f.invoice_no] || []).push(f));
  const notExec = (d.rules||[]).some(r => /未执行/.test(r.state || ""));
  const invs = (d.invoices||[]).map(i => {
    const fs = (byInv[i.invoice_no]||[]).slice()
      .sort((a,b) => (sevRank[a.severity] ?? 9) - (sevRank[b.severity] ?? 9) || a.rule_id.localeCompare(b.rule_id));
    const maxSev = fs.length ? Math.min(...fs.map(f => sevRank[f.severity] ?? 9)) : 9;
    return { ...i, fs, maxSev, clean: fs.length === 0 };
  }).sort((a,b) => {
    if (a.clean !== b.clean) return a.clean ? 1 : -1;                 // 无命中票最后
    if (a.maxSev !== b.maxSev) return a.maxSev - b.maxSev;           // 最高严重度降序
    if (a.fs.length !== b.fs.length) return b.fs.length - a.fs.length; // 命中数降序
    return a.invoice_no.localeCompare(b.invoice_no);                 // 票号稳定升序
  });
  if (!invs.length) return `<div class="card card-pad"><div class="hint">无发票数据。</div></div>`;
  return `${notExec ? `<div class="view-note">⚠ 部分规则未执行（数据不足/未配置），不能据此判定无命中</div>` : ""}
  <div class="inv-group">${invs.map(i => `
    <details class="inv-card${i.clean ? " clean" : ""}${notExec && i.clean ? " partial" : ""}">
      <summary class="inv-head">
        <span class="inv-no">${esc(shortNo(i.invoice_no))}</span>
        <span class="inv-full">${esc(i.invoice_no)}</span>
        <span class="inv-meta">${esc(i.seller_name || "")} · ${esc(i.issue_date || "")} · ¥${esc(i.total || i.amount || "—")}</span>
        ${i.clean
          ? (notExec ? `<span class="stb q">？ 未完全检查</span>` : `<span class="stb ok">✓ 无命中</span>`)
          : `<span class="stb warn">${i.fs.length} 条命中</span>`}
        <span class="caret">▸</span>
      </summary>
      <div class="inv-body">
        ${i.clean
          ? `<div class="inv-clean-note">${notExec ? "本票无命中，但部分规则未执行，不能判定绝对合规（最后≠最干净）" : "无命中风险（已按当前规则检查，不代表绝对合规）"}</div>`
          : `<div class="inv-list">${i.fs.map(f => findingRow(f, metaMap, true)).join("")}</div>`}
      </div>
    </details>`).join("")}</div>`;
}

/* 规则效果视图（P1③）：以 d.rules 为唯一源，审批/审计视角，不参与处置主路径 */
function ruleViewHtml(d, metaMap) {
  const sevRank = {高:0, 中:1, 低:2};
  const byRule = {};
  (d.findings||[]).forEach(f => (byRule[f.rule_id] = byRule[f.rule_id] || []).push(f));
  const nInv = (d.invoices||[]).length;
  const rules = (d.rules||[]).map(r => {
    const hits = (byRule[r.rule_id]||[]).slice()
      .sort((a,b) => (sevRank[a.severity] ?? 9) - (sevRank[b.severity] ?? 9) || a.invoice_no.localeCompare(b.invoice_no));
    const notExec = /未执行/.test(r.state || "");
    const maxSev = hits.length ? Math.min(...hits.map(f => sevRank[f.severity] ?? 9)) : 9;
    return { ...r, hits, hit: hits.length, miss: notExec ? null : Math.max(0, nInv - hits.length), notExec, maxSev };
  }).sort((a,b) => {
    if (a.maxSev !== b.maxSev) return a.maxSev - b.maxSev;            // 最高严重度降序
    if (a.hit !== b.hit) return b.hit - a.hit;                       // 命中数降序
    return (a.rule_id || "").localeCompare(b.rule_id || "");         // 规则名升序
  });
  if (!rules.length) return `<div class="card card-pad"><div class="hint">无规则数据。</div></div>`;
  return `<div class="view-note">规则效果视图（只读分析视角，不参与处置）：每条规则的命中/未命中/未执行三态；未执行不代表合规，需补数据/配置后重跑；处置请到风险/发票视图</div>
  <div class="rule-group">${rules.map(r => {
    const sev = r.severity || "中";
    const sevCls = SEV_CLS[sev] || "low";
    return `<div class="rule-card">
      <div class="rule-head">
        <span class="sev ${sevCls}">${esc(r.rule_id)} ${esc(sev)}</span>
        <span class="rname">${esc(resolveRuleMeta(r.rule_id, metaMap))}</span>
        <span class="rule-cnt">命中 <b>${r.hit}</b>${r.notExec ? ` · <span class="fail">未执行</span>` : ` · 未命中 <b>${r.miss}</b>`}</span>
      </div>
      ${r.hit ? `<details class="rule-hits"><summary>命中票（${r.hit}）</summary><div class="inner">${r.hits.map(f => findingRow(f, metaMap, false)).join("")}</div></details>` : ""}
      ${r.notExec ? `<div class="rule-note">未执行（${esc(r.state)}）——不能判定合规，需补齐数据/配置后重跑</div>` : ""}
    </div>`;
  }).join("")}</div>`;
}

/* 视图切换（P1③）：localStorage 持久化，非法值回退风险视图；renderReport 重渲染后保持 */
const VIEW_KEY = "fap:report-view";
function applyFltState(v) {
  const off = v !== "risk";
  document.querySelectorAll(".flt").forEach(b => { b.disabled = off; });
  const h = document.getElementById("fltHint");
  if (h) h.textContent = off ? "筛选仅作用于风险视图" : "";
}
function setView(v) {
  if (!["risk","invoice","rule"].includes(v)) v = "risk";
  try { localStorage.setItem(VIEW_KEY, v); } catch (e) { /* 存储不可用：视图状态不保留，回退风险视图 */ }
  document.querySelectorAll(".report-view").forEach(el => { el.hidden = el.id !== "view-" + v; });
  document.querySelectorAll(".vs").forEach(b => b.classList.toggle("active", b.dataset.view === v));
  applyFltState(v);
  updatePrintHead(v);
}
function applyView() {
  let v = localStorage.getItem(VIEW_KEY);
  if (!["risk","invoice","rule"].includes(v)) v = "risk";
  document.querySelectorAll(".report-view").forEach(el => { el.hidden = el.id !== "view-" + v; });
  document.querySelectorAll(".vs").forEach(b => b.classList.toggle("active", b.dataset.view === v));
  applyFltState(v);
  updatePrintHead(v);
}
function updatePrintHead(v) {
  const ph = document.getElementById("printHead");
  if (!ph || !__lastReport) return;
  const name = {risk:"风险视图", invoice:"发票视图", rule:"规则效果视图"}[v] || "风险视图";
  ph.textContent = name + " · 规则包 " + (__lastReport.ruleset?.version || __lastReport.ruleset_version || "?") + " · 生成 " + (__lastReport.generated_at || "");
}

function __origRender(d) {
  const el = $("result");
  $("empty").style.display = "none";
  if (!d || d.error) { el.innerHTML = `<div class="card card-pad high">${esc(d?.error || "无响应")}</div>`; return; }
  const s = d.summary || {};
  const rules = d.rules || [], rs = d.rules_summary || {};
  const stateNote = rs.enabled_count ? `启用 ${rs.enabled_count} 条 · 命中 ${rs.命中||0} · 未命中 ${rs.未命中||0} · 未执行 ${rs.未执行||0}` : "";

  const kpis = `
  <div class="kpis">
    <div class="kpi main"><div class="n">${esc(s.file_count ?? 0)}</div><div class="l">文件数</div></div>
    <div class="kpi main"><div class="n">¥${esc(s.total_amount ?? "—")}</div><div class="l">金额合计（价税）</div></div>
    <div class="kpi main"><div class="n mid">${esc(s.review_count ?? 0)}</div><div class="l">待复核</div></div>
    <div class="kpi"><div class="n">${esc(s.total_count ?? 0)}</div><div class="l">成功解析</div></div>
    <div class="kpi"><div class="n ok">${esc(s.no_finding_count ?? 0)}</div><div class="l">未见异常</div></div>
    <div class="kpi"><div class="n high">${esc(s.failed_count ?? 0)}</div><div class="l">解析失败</div></div>
  </div>`;

  const metaMap = buildRuleMetaMap(d.rules);
  const rname = id => resolveRuleMeta(id, metaMap);
  const findings = (d.findings||[]).length === 0
    ? `<div class="card card-pad"><div class="hint">本批次未见规则命中，报告完成 ✓<br/>未命中不等于合规，请结合规则覆盖范围判断。</div></div>`
    : (d.findings||[]).map(f => findingRow(f, metaMap, true)).join("");
  const farr = d.findings || [];
  const cnt = { pending: 0, resolved: 0, ignored: 0 };
  farr.forEach(f => { const s = (getDisp(riskId(f)) || {}).status || "pending"; cnt[s]++; });
  const done = farr.length > 0 && cnt.pending === 0;
  const dispBar = farr.length ? `<div class="disps">
    <span class="dp pending">待处理 <b>${cnt.pending}</b></span>
    <span class="dp resolved">已处理 <b>${cnt.resolved}</b></span>
    <span class="dp ignored">已忽略 <b>${cnt.ignored}</b></span>
    <span class="hint">口径：已处理+已忽略=完成 · 规则升版后处置状态会重置（结论可能变化需重判）${window.__dispStoreFail ? ` · <span class="fail">存储不可用，本次处置不会保留</span>` : ""}</span>
    ${done ? `<span class="alldone">✓ 全部处置完成，可导出</span>` : ""}
  </div>` : "";

  const invoices = `
  <details class="adv section" id="invSec">
    <summary>发票明细（${(d.invoices||[]).length}）</summary>
    <div class="inner">
      <table>
        <tr><th>票号</th><th>日期</th><th>类型</th><th>金额</th><th>税额</th><th>价税合计</th><th>行数</th><th>状态</th></tr>
        ${(d.invoices||[]).map(i => {
          const stCls = i.status === "未见异常" ? "ok" : i.status === "待复核" || i.status === "待复核（字段缺失）" ? "mid" : "high";
          return `<tr><td>${esc(i.invoice_no)}</td><td>${esc(i.issue_date)}</td><td>${esc(i.invoice_type)}</td>
            <td>${esc(i.amount)}</td><td>${esc(i.tax)}</td><td>${esc(i.total)}</td>
            <td>${esc(i.item_count ?? 0)}${i.warning_count ? `<span class="hint">（${i.warning_count} 告警）</span>` : ""}</td>
            <td class="${stCls}">${esc(i.status)}</td></tr>`;
        }).join("") || `<tr><td colspan="8" class="hint">无成功解析的发票</td></tr>`}
      </table>
      ${(d.failed||[]).length ? `<div class="hint" style="margin-top:8px;">解析失败：${d.failed.map(f => `<span class="fail">${esc(f.file)}</span>：${esc(f.error)}`).join("；")}</div>` : ""}
    </div>
  </details>`;

  const rulesSec = `
  <details class="adv section">
    <summary>规则清单（${stateNote}）</summary>
    <div class="inner">
      <table>
        <tr><th>规则</th><th>名称</th><th>状态</th></tr>
        ${(rules||[]).map(r => {
          const st = r.state || "未执行";
          const cls = st === "命中" ? "pill hit" : st === "未命中" ? "pill nohit" : "pill skip";
          return `<tr><td><b>${esc(r.rule_id)}</b></td><td>${esc(r.name)}</td><td><span class="${cls}">${esc(st)}</span></td></tr>`;
        }).join("")}
      </table>
    </div>
  </details>`;

  const html = `
  <div class="card">${kpis}</div>
  <div class="print-head" id="printHead"></div>
  <div class="view-switch">
    <button class="vs active" data-view="risk">风险视图</button>
    <button class="vs" data-view="invoice">发票视图</button>
    <button class="vs" data-view="rule">规则视图</button>
  </div>
  <div class="section">
    <div class="section-head">
      <div class="tools">
        <span class="hint" id="fltHint" style="margin:0 4px 0 0;"></span>
        <button class="btn-ghost flt active" data-flt="all">全部</button>
        <button class="btn-ghost flt" data-flt="pending">待处理</button>
        <button class="btn-ghost" onclick="exportCSV(${JSON.stringify(d.findings||[]).replace(/"/g,"&quot;")}, ${JSON.stringify(d.rules||[]).replace(/"/g,"&quot;")})">导出 CSV</button>
        <button class="btn-ghost" onclick="window.print()">打印</button>
      </div>
    </div>
    ${dispBar}
    <div id="view-risk" class="report-view"><h2>风险清单 <span class="sub">${(d.findings||[]).length} 条命中 · 按严重度排序</span></h2>${findings}</div>
    <div id="view-invoice" class="report-view" hidden><h2>发票视图 <span class="sub">${(d.invoices||[]).length} 张票 · 无命中票最后</span></h2>${invoiceViewHtml(d, metaMap)}</div>
    <div id="view-rule" class="report-view" hidden><h2>规则效果视图 <span class="sub">${(d.rules||[]).length} 条规则 · 三态口径</span></h2>${ruleViewHtml(d, metaMap)}</div>
  </div>
  ${invoices}
  ${rulesSec}
  <div class="meta">
    <div>规则包：${esc(d.ruleset?.version || d.ruleset_version)}（生效 ${esc(d.ruleset?.effective_date || "")}）· 批次 ${esc(d.batch_id)} · 生成 ${esc(d.generated_at)}</div>
    <div>范围说明：${esc(d.ruleset?.scope_note || d.scope_note || "")}</div>
  </div>
  <div class="disc">${esc(d.disclaimer || DISCLAIMER)}</div>`;
  el.innerHTML = html;
  applyView();
}

/* ---------- 模式切换 ---------- */
function setMode(live) {
  document.body.classList.toggle("live", live);
  $("modeLabel").textContent = live ? "真实模式（连后端）" : "演示模式（内置样例）";
  $("modeLabel").className = "badge " + (live ? "live" : "demo");
  $("btnDemo").classList.toggle("active", !live);
  $("btnLive").classList.toggle("active", live);
  if (live) {
    $("backendUrl").value = localStorage.getItem("ipc_backend") || "http://localhost:8000";
    $("apiKey").value = localStorage.getItem("ipc_key") || "";
    $("empty").style.display = "";
    $("result").innerHTML = "";
  }
}

/* ---------- 真实模式：连接 + 预审 ---------- */
async function healthCheck() {
  const url = $("backendUrl").value.trim().replace(/\/+$/, "");
  if (!url) { $("connHint").textContent = "请填写后端地址"; return false; }
  localStorage.setItem("ipc_backend", url);
  try {
    const r = await fetch(url + "/healthz", {method:"GET"});
    if (r.ok) { const j = await r.json(); $("connHint").textContent = "连接成功 · 服务正常（ruleset " + (j.ruleset || "?") + "）"; $("connHint").className = "hint okc"; return true; }
    $("connHint").textContent = "连接失败：HTTP " + r.status + "（后端未启动？地址不对？）"; $("connHint").className = "hint err"; return false;
  } catch (e) { $("connHint").textContent = "连接失败：" + e.message + "（注意：GitHub Pages 是 https，后端需 https 或 localhost）"; $("connHint").className = "hint err"; return false; }
}

async function runReview() {
  const url = $("backendUrl").value.trim().replace(/\/+$/, "");
  const key = $("apiKey").value.trim();
  const files = $("fileInput").files;
  if (!url) { $("connHint").textContent = "请填写后端地址"; $("connHint").className = "hint err"; return; }
  if (!key) { $("connHint").textContent = "请填写 API Key（后端环境变量 INVOICE_API_KEY 的值）"; $("connHint").className = "hint err"; return; }
  if (!files.length) { $("runHint").textContent = "请选择要上传的发票文件（XML/OFD）"; $("runHint").className = "hint err"; return; }
  localStorage.setItem("ipc_backend", url); localStorage.setItem("ipc_key", key);
  const fd = new FormData();
  for (const f of files) fd.append("files", f, f.name);
  $("btnReview").disabled = true; $("btnReview").textContent = "预审中…";
  try {
    const r = await fetch(url + "/review", {method:"POST", headers:{"X-API-Key": key}, body: fd});
    const j = await r.json();
    if (!r.ok) { $("result").innerHTML = `<div class="card card-pad high">后端拒绝：${esc(j.detail || ("HTTP " + r.status))}</div>`; return; }
    render(j);
    if ((j.findings||[]).length) {
      try {
        const er = await fetch(url + "/v1/findings/explain", {method:"POST",
          headers:{"X-API-Key": key, "Content-Type":"application/json"},
          body: JSON.stringify({findings: j.findings})});
        if (er.ok) {
          const ej = await er.json();
          (ej.explanations||[]).forEach((exp, i) => { if (exp && j.findings[i]) j.findings[i].explanation = exp; });
          render(j);
        }
      } catch (e2) { /* 解释获取失败：保留已渲染的报告 */ }
    }
  } catch (e) {
    $("result").innerHTML = `<div class="card card-pad high">请求失败：${esc(e.message)}（检查后端地址与网络；跨域需后端 CORS 放行）</div>`;
  } finally {
    $("btnReview").disabled = false; $("btnReview").textContent = "运行预审";
  }
}

/* ---------- 上传交互 ---------- */
const dz = $("dropZone");
dz.addEventListener("click", () => $("fileInput").click());
dz.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("fileInput").click(); } });
dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("over"); });
dz.addEventListener("dragleave", () => dz.classList.remove("over"));
dz.addEventListener("drop", e => {
  e.preventDefault(); dz.classList.remove("over");
  if (e.dataTransfer.files.length) { $("fileInput").files = e.dataTransfer.files; syncFiles(); }
});
document.addEventListener("paste", e => {
  const items = e.clipboardData?.items || [];
  const dt = new DataTransfer();
  let got = false;
  for (const it of items) if (it.kind === "file") { dt.items.add(it.getAsFile()); got = true; }
  if (got) { $("fileInput").files = dt.files; syncFiles(); }
});
function syncFiles() {
  const fs = $("fileInput").files;
  $("fileList").innerHTML = fs.length
    ? Array.from(fs).map(f => `<div class="f"><span>📎</span><span class="nm">${esc(f.name)}</span><span>${(f.size/1024).toFixed(0)}KB</span></div>`).join("")
    : "";
  $("runHint").textContent = fs.length ? `已选 ${fs.length} 个文件，点击「运行预审」开始。` : "运行后右侧显示合规预审报告。文件仅发往你配置的后端，不发送第三方。";
  $("runHint").className = "hint";
}
$("fileInput").onchange = syncFiles;

/* 拍照识别（规划中能力位，DeepSeek 评审修正：不触发选图，直接显示提示） */
$("btnCamera").onclick = () => {
  $("runHint").textContent = "拍照识别（OCR）规划在真实模式后端接入后上线。当前演示版仅解析 XML/OFD 结构化文件，请上传数电票 XML 或 OFD 文件。";
  $("runHint").className = "hint err";
};

/* ---------- 绑定 ---------- */
$("btnDemo").onclick = () => { setMode(false); render(demoReport()); };
$("btnLive").onclick = () => setMode(true);
$("btnRun").onclick = () => render(demoReport());
$("btnTest").onclick = healthCheck;
$("btnReview").onclick = runReview;

/* 初始：演示模式展示内置样例（一打开就能看到产品样子） */
setMode(false);
render(demoReport());
</script>
